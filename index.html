<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ライフプランニング逆算電卓</title>
<style>
/* ===== 1. デザイントークン ===== */
:root{
  --bg:#f7f8fb; --panel:#ffffff; --border:#dde1e8; --text:#1b2230; --text-dim:#5b6472;
  --accent:#2f6fed; --accent-dim:#e8f0fe; --good:#1a8f5e; --bad:#d64545; --warn:#c8791a;
  --series-living:#2a78d6; --series-housing:#1baf7a; --series-edu:#eda100;
  --radius:10px; --shadow:0 1px 3px rgba(20,30,60,.08), 0 1px 2px rgba(20,30,60,.06);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12141a; --panel:#1b1f29; --border:#333a48; --text:#eef1f6; --text-dim:#9aa4b4;
    --accent:#6d9bff; --accent-dim:#1d2740; --good:#3fce93; --bad:#ff6b6b; --warn:#ffb454;
    --series-living:#3987e5; --series-housing:#199e70; --series-edu:#c98500; }
}
:root[data-theme="dark"]{ --bg:#12141a; --panel:#1b1f29; --border:#333a48; --text:#eef1f6; --text-dim:#9aa4b4;
  --accent:#6d9bff; --accent-dim:#1d2740; --good:#3fce93; --bad:#ff6b6b; --warn:#ffb454;
  --series-living:#3987e5; --series-housing:#199e70; --series-edu:#c98500; }
:root[data-theme="light"]{ --bg:#f7f8fb; --panel:#ffffff; --border:#dde1e8; --text:#1b2230; --text-dim:#5b6472;
  --accent:#2f6fed; --accent-dim:#e8f0fe; --good:#1a8f5e; --bad:#d64545; --warn:#c8791a;
  --series-living:#2a78d6; --series-housing:#1baf7a; --series-edu:#eda100; }
/* ===== 2. リセット / 基本タイポグラフィ ===== */
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.6; }
h1,h2,h3{ margin:0 0 .5em; }
h1{ font-size:1.3rem; } h2{ font-size:1.05rem; } h3{ font-size:.92rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.03em; }
p{ margin:.3em 0; }
small,.hint{ color:var(--text-dim); font-size:.82rem; }
button{ font-family:inherit; }
table{ border-collapse:collapse; width:100%; font-size:.86rem; }
th,td{ padding:.4em .6em; text-align:right; border-bottom:1px solid var(--border); }
th:first-child,td:first-child{ text-align:left; }
a{ color:var(--accent); }
/* ===== 3. レイアウト ===== */
header.app-header{ padding:1rem 1.2rem; border-bottom:1px solid var(--border); background:var(--panel); }
header.app-header p{ color:var(--text-dim); font-size:.88rem; }
nav.wizard-steps{ display:flex; overflow-x:auto; gap:.3rem; padding:.5rem 1.2rem; background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; }
nav.wizard-steps button{ flex:0 0 auto; padding:.5rem .9rem; border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:999px; cursor:pointer; font-size:.85rem; white-space:nowrap; }
nav.wizard-steps button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
.layout{ display:grid; grid-template-columns:1fr 320px; gap:1rem; padding:1rem 1.2rem 3rem; max-width:1200px; margin:0 auto; align-items:start; }
@media (max-width: 880px){
  .layout{ grid-template-columns:1fr; padding-bottom:1rem; }
  /* モバイルではサマリーを画面下部に貼り付くコンパクトなバーにする(入力フォームを1画面目に出す) */
  aside#live-summary{ position:sticky; bottom:0; top:auto; z-index:6; padding:.6rem .8rem; border-radius:12px 12px 0 0; box-shadow:0 -2px 10px rgba(20,30,60,.15); }
  aside#live-summary h2{ display:none; }
  aside#live-summary .kpi-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:.4rem; }
  aside#live-summary .kpi{ margin-bottom:0; }
  aside#live-summary .kpi .value{ font-size:1rem; }
  aside#live-summary .kpi .sub{ display:none; }
  aside#live-summary .kpi .label{ font-size:.68rem; line-height:1.3; }
  aside#live-summary .warn-box{ margin:.4rem 0 0; padding:.35rem .5rem; font-size:.72rem; }
}
main{ min-width:0; }
section.step{ display:none; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:1rem 1.1rem; box-shadow:var(--shadow); margin-bottom:1rem; }
section.step.active{ display:block; }
.field-row{ display:flex; flex-wrap:wrap; gap:.8rem; margin-bottom:.7rem; }
.field{ display:flex; flex-direction:column; gap:.25rem; flex:1 1 180px; min-width:150px; }
.field label{ font-size:.82rem; color:var(--text-dim); }
input[type=number], input[type=text], select{
  padding:.45rem .55rem; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-size:.9rem;
}
.radio-cards{ display:flex; gap:.5rem; flex-wrap:wrap; }
.radio-cards label{ border:1px solid var(--border); border-radius:8px; padding:.5rem .8rem; cursor:pointer; font-size:.86rem; background:var(--bg); }
.radio-cards input{ margin-right:.35rem; }
.radio-cards label:has(input:checked){ border-color:var(--accent); background:var(--accent-dim); }
/* ===== 4. スライダー ===== */
.slider-field{ margin-bottom:1rem; }
.slider-field .slider-labels{ display:flex; justify-content:space-between; font-size:.78rem; color:var(--text-dim); margin-top:.15rem; }
.slider-field .slider-value{ font-weight:600; color:var(--accent); }
input[type=range]{ -webkit-appearance:none; width:100%; height:6px; border-radius:999px; background:var(--border); outline:none; }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--accent); cursor:grab; border:3px solid var(--panel); box-shadow:0 0 0 1px var(--accent); }
input[type=range]::-webkit-slider-thumb:active{ cursor:grabbing; }
input[type=range]::-moz-range-thumb{ width:20px; height:20px; border-radius:50%; background:var(--accent); cursor:grab; border:3px solid var(--panel); box-shadow:0 0 0 1px var(--accent); }
/* ===== テンプレートカード ===== */
.template-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:.7rem; margin-bottom:.5rem; }
.template-card{ border:1px solid var(--border); border-radius:var(--radius); padding:.8rem; cursor:pointer; background:var(--bg); text-align:left; }
.template-card:hover{ border-color:var(--accent); }
.template-card h3{ margin:0 0 .3rem; color:var(--text); font-size:.95rem; text-transform:none; letter-spacing:0; }
.template-card p{ font-size:.8rem; color:var(--text-dim); margin:0; }
/* 子供リスト */
.child-row{ border:1px dashed var(--border); border-radius:8px; padding:.7rem; margin-bottom:.6rem; position:relative; }
.child-row button.remove{ position:absolute; top:.5rem; right:.5rem; background:none; border:none; color:var(--bad); cursor:pointer; font-size:.85rem; }
.btn{ padding:.5rem .9rem; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; font-size:.86rem; }
.btn.secondary{ background:var(--bg); color:var(--accent); }
.toggle-advanced{ font-size:.82rem; color:var(--accent); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; margin-bottom:.6rem; }
.advanced-panel{ display:none; border-top:1px dashed var(--border); padding-top:.7rem; margin-top:.3rem; }
.advanced-panel.open{ display:block; }
/* ===== 常時表示サマリー ===== */
aside#live-summary{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:1rem; box-shadow:var(--shadow); position:sticky; top:60px; }
.kpi{ margin-bottom:.9rem; }
.kpi .label{ font-size:.78rem; color:var(--text-dim); }
.kpi .value{ font-size:1.35rem; font-weight:700; }
.kpi .value.bad{ color:var(--bad); } .kpi .value.good{ color:var(--good); }
.kpi .sub{ font-size:.76rem; color:var(--text-dim); }
/* ===== チャート/テーブル ===== */
.chart-wrap{ overflow-x:auto; margin:.6rem 0; }
svg.chart{ font-family:inherit; width:100%; height:auto; max-width:760px; display:block; }
.chart .axis line, .chart .axis path{ stroke:var(--border); }
.chart .axis text{ fill:var(--text-dim); font-size:10px; }
.chart .gridline{ stroke:var(--border); stroke-dasharray:2,3; }
.tooltip{ position:fixed; background:var(--text); color:var(--bg); padding:.3rem .5rem; border-radius:6px; font-size:.78rem; pointer-events:none; display:none; z-index:50; max-width:280px; }
.legend{ display:flex; gap:1rem; flex-wrap:wrap; font-size:.78rem; color:var(--text-dim); margin:.2rem 0 .4rem; }
.legend .swatch{ width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:.35rem; }
.hero-result{ margin:.4rem 0 1.1rem; }
.hero-result .label{ font-size:.85rem; color:var(--text-dim); }
.hero-result .big{ font-size:2.2rem; font-weight:800; line-height:1.2; color:var(--accent); }
.hero-result .sub{ font-size:.85rem; color:var(--text-dim); margin-top:.2rem; }
.kpi-row{ display:flex; gap:1.6rem; flex-wrap:wrap; }
.info{ display:inline-flex; align-items:center; justify-content:center; width:1.05rem; height:1.05rem; border-radius:50%; border:1px solid var(--text-dim); color:var(--text-dim); font-size:.68rem; margin-left:.35rem; cursor:help; user-select:none; flex:none; }
.attribution-table td.delta{ color:var(--bad); font-weight:600; font-variant-numeric:tabular-nums; }
.scenario-bar{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin:.4rem 0; }
td,th{ font-variant-numeric:tabular-nums; }
/* 達成度ゲージ */
.gauge{ height:10px; background:var(--border); border-radius:999px; overflow:hidden; margin:.5rem 0 .25rem; max-width:420px; }
.gauge .fill{ height:100%; border-radius:999px; background:var(--good); transition:width .3s; }
.gauge .fill.warn{ background:var(--warn); }
.gauge .fill.low{ background:var(--accent); }
.gauge-msg{ font-size:.88rem; margin-bottom:.4rem; }
/* 毎月の家計カード */
.budget-card{ border:1px solid var(--border); border-radius:var(--radius); padding:.8rem 1rem; margin:.5rem 0 1rem; background:var(--bg); max-width:560px; }
.budget-row{ display:grid; grid-template-columns:1fr auto; gap:.1rem .6rem; align-items:center; margin:.4rem 0; font-size:.9rem; }
.budget-row .amount{ text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
.budget-row .bar{ grid-column:1/-1; height:8px; border-radius:999px; }
.budget-row .bar i{ display:block; height:100%; border-radius:999px; }
.budget-total{ border-top:1px dashed var(--border); margin-top:.6rem; padding-top:.6rem; font-weight:700; font-size:.95rem; }
.budget-total.good{ color:var(--good); } .budget-total.bad{ color:var(--bad); }
/* 次のアクション */
.action-cards{ display:grid; gap:.6rem; margin:.5rem 0 1rem; }
.action-card{ display:flex; gap:.7rem; border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:8px; padding:.7rem .9rem; background:var(--bg); align-items:flex-start; }
.action-card .num{ font-weight:800; color:var(--accent); font-size:1.15rem; line-height:1.4; }
.action-card .body{ flex:1; }
.action-card .body p{ margin:.15rem 0; font-size:.88rem; }
.action-card .body .btn{ margin-top:.35rem; }
.warn-box{ background:var(--accent-dim); border:1px solid var(--accent); border-radius:8px; padding:.6rem .8rem; font-size:.84rem; margin:.5rem 0; }
.warn-box.danger{ border-color:var(--bad); background:rgba(214,69,69,.08); }
/* ===== フッター / 出典 ===== */
footer#data-sources{ max-width:1200px; margin:0 auto; padding:1rem 1.2rem 3rem; font-size:.78rem; color:var(--text-dim); }
footer#data-sources ol{ padding-left:1.2rem; }
footer#data-sources li{ margin-bottom:.25rem; }
.step-nav-buttons{ display:flex; justify-content:space-between; margin-top:.8rem; }
</style>
</head>
<body>

<header class="app-header">
  <h1>ライフプランニング逆算電卓</h1>
  <p>「いくら稼げるか」ではなく「どう生きたいか」から。理想の暮らしを描くと、必要な年収と毎月のマネープランを逆算します。</p>
</header>

<nav class="wizard-steps" id="wizard-nav"></nav>

<div class="layout">
  <main id="main-steps"></main>

  <aside id="live-summary" aria-live="polite">
    <h2>現在地サマリー</h2>
    <div class="kpi-grid">
      <div class="kpi">
        <div class="label">この暮らしに必要な年収</div>
        <div class="value" id="kpi-income">-</div>
        <div class="sub" id="kpi-income-sub"></div>
      </div>
      <div class="kpi">
        <div class="label">必要な月次投資額</div>
        <div class="value" id="kpi-pmt">-</div>
        <div class="sub" id="kpi-pmt-sub">現在の年収のまま暮らす場合</div>
      </div>
      <div class="kpi">
        <div class="label">生涯資金ギャップ（現在価値）</div>
        <div class="value" id="kpi-gap">-</div>
        <div class="sub">既存貯蓄を差し引いた不足額</div>
      </div>
    </div>
    <div id="nisa-warning"></div>
  </aside>
</div>

<footer id="data-sources">
  <h2>データ出典</h2>
  <ol id="sources-list"></ol>
  <p>※本ツールの数値は公的統計に基づく概算シミュレーションであり、将来の実績を保証するものではありません。住宅購入価格・結婚費用・単身者の老後生活費など公的な相場データを直接得られなかった項目はユーザー入力・目安値としています。</p>
</footer>

<div class="tooltip" id="tooltip"></div>

<script>
'use strict';
/* =====================================================================
   A. 参照データ定数
===================================================================== */
const DATA_SOURCES = {
  mext2023:  { label: '文部科学省 令和5年度子供の学習費調査（2024/12/25公表）', url: 'https://www.mext.go.jp/b_menu/toukei/chousa03/gakushuuhi/kekka/k_detail/mext_00002.html' },
  jfc2021:   { label: '日本政策金融公庫 教育費負担の実態調査（令和3年度）', url: 'https://www.jfc.go.jp/n/findings/pdf/kyouikuhi_chousa_k_r03.pdf' },
  seiho2025: { label: '生命保険文化センター「生活保障に関する調査」2025年度速報値', url: 'https://www.jili.or.jp/lifeplan/lifesecurity/1130.html' },
  mhlw2024:  { label: '厚生労働省 令和6年度年金額改定・年金制度基礎資料集', url: 'https://www.mhlw.go.jp/content/12500000/001559774.pdf' },
  boj:       { label: '日本銀行「2%の物価安定の目標」', url: 'https://www.boj.or.jp/mopo/outline/target.htm' },
  gpif:      { label: 'GPIF 年金積立金管理運用独立行政法人 運用実績（2001〜2024年度）', url: 'https://www.gpif.go.jp/operation/' },
  fsa:       { label: '金融庁 NISA制度', url: 'https://www.fsa.go.jp/policy/nisa2/know/index.html' },
  nta2023:   { label: '国税庁 令和5年分民間給与実態統計調査', url: 'https://www.nta.go.jp/publication/statistics/kokuzeicho/minkan/gaiyou/2023.htm' },
  soumu2023: { label: '総務省 令和5年住宅・土地統計調査', url: 'https://www.stat.go.jp/data/jyutaku/2023/pdf/kihon_gaiyou.pdf' },
  kakei2023: { label: '総務省 家計調査（二人以上の世帯、2023年）', url: 'https://www.stat.go.jp/data/kakei/sokuhou/tsuki/pdf/fies_gaikyo2023.pdf' },
};

const EDUCATION_COSTS = {
  kindergarten: { label:'幼稚園', startAge:3, years:3, public:185000, private:347000, source:'mext2023' },
  elementary:   { label:'小学校', startAge:6, years:6, public:336000, private:1828000, source:'mext2023' },
  juniorHigh:   { label:'中学校', startAge:12, years:3, public:542000, private:1560000, source:'mext2023' },
  highSchool:   { label:'高校',   startAge:15, years:3, public:597752, private:1030283, source:'mext2023' },
};
const UNIVERSITY_COSTS = {
  label:'大学', startAge:18, years:4, source:'jfc2021',
  national:       { label:'国公立',     entrance:672000, annual:1035000 },
  privateLiberal: { label:'私立文系',   entrance:818000, annual:1520000 },
  privateScience: { label:'私立理系',   entrance:888000, annual:1832000 },
};

const REGION_INFO = {
  tokyo23:    { label:'東京23区',       rentPerSqm:3800 },
  metroCity:  { label:'首都圏・政令市', rentPerSqm:2600 },
  coreCity:   { label:'地方中核市',     rentPerSqm:1900 },
  otherRegion:{ label:'その他地方',     rentPerSqm:1400 },
};
const RENT_SOURCE = 'soumu2023';

const RETIREMENT_MIN_MONTHLY = 239000;      // seiho2025
const RETIREMENT_COMFORT_MONTHLY = 391000;  // seiho2025

const PENSION_MODEL_COUPLE_MONTHLY = 232784; // mhlw2024 令和6年度モデル年金(夫婦2人分)
const PENSION_BASIC_FULL_MONTHLY = 67808;    // mhlw2024 老齢基礎年金満額(1人)

const BASELINE_LIVING_MONTHLY = 293997; // kakei2023 二人以上世帯 消費支出平均(月額)

const INFLATION_DEFAULT = 0.02; // boj
const RETURN_PRESETS = { conservative:0.03, standard:0.04, aggressive:0.05, gpifHistorical:0.0418 };
const NISA_LIMITS = { tsumitateAnnual:1_200_000, growthAnnual:2_400_000, combinedAnnual:3_600_000, lifetimeTotal:18_000_000, lifetimeGrowthOnly:12_000_000 };

const TEMPLATES = {
  steady: {
    label:'堅実プラン', desc:'地方・賃貸・公立中心・最低限の老後',
    profile:{ currentAge:28, currentIncome:4000000, currentSavings:1000000, marriageAge:30 },
    housing:{ tenure:'rent', region:'otherRegion', sizeSqm:55, purchasePrice:0, downPayment:0, loanYears:35, loanRate:1.0 },
    lifestyle:{ luxury:0.3, diningOutPerWeek:1, commute:0.3 },
    children:[ { birthParentAge:32, track:'public' }, { birthParentAge:35, track:'public' } ],
    retirement:{ retireAge:65, level:0.0, pensionType:'model' },
    investment:{ returnRate:0.03, inflationRate:0.02, netIncomeRatio:0.8 },
  },
  standard: {
    label:'標準プラン', desc:'地方中核市・持ち家・公私混在・ややゆとりある老後',
    profile:{ currentAge:28, currentIncome:5000000, currentSavings:2000000, marriageAge:29 },
    housing:{ tenure:'own', region:'coreCity', sizeSqm:75, purchasePrice:35000000, downPayment:5000000, loanYears:35, loanRate:1.0 },
    lifestyle:{ luxury:0.5, diningOutPerWeek:2, commute:0.5 },
    children:[ { birthParentAge:31, track:'public' }, { birthParentAge:33, track:'mixed' } ],
    retirement:{ retireAge:65, level:0.5, pensionType:'model' },
    investment:{ returnRate:0.04, inflationRate:0.02, netIncomeRatio:0.78 },
  },
  urban: {
    label:'都心共働きプラン', desc:'東京23区・私立中心・ゆとりある老後',
    profile:{ currentAge:29, currentIncome:7000000, currentSavings:4000000, marriageAge:30 },
    housing:{ tenure:'own', region:'tokyo23', sizeSqm:70, purchasePrice:70000000, downPayment:10000000, loanYears:35, loanRate:0.8 },
    lifestyle:{ luxury:0.75, diningOutPerWeek:4, commute:0.7 },
    children:[ { birthParentAge:32, track:'private' }, { birthParentAge:34, track:'private' } ],
    retirement:{ retireAge:65, level:1.0, pensionType:'model' },
    investment:{ returnRate:0.05, inflationRate:0.02, netIncomeRatio:0.75 },
  },
};

const EDU_TRACK_PRESETS = {
  public: { kindergarten:'public', elementary:'public', juniorHigh:'public', highSchool:'public', university:'national' },
  mixed:  { kindergarten:'public', elementary:'public', juniorHigh:'public', highSchool:'public', university:'privateLiberal' },
  private:{ kindergarten:'private', elementary:'private', juniorHigh:'private', highSchool:'private', university:'privateLiberal' },
};

/* =====================================================================
   B. 状態
===================================================================== */
const state = JSON.parse(JSON.stringify(TEMPLATES.standard));
state.activeStep = 'start';
state.appliedTemplate = 'standard';

function persistState(){
  try{ localStorage.setItem('lifeplan_state', JSON.stringify(state)); }catch(e){}
}
function loadPersistedState(){
  try{
    const raw = localStorage.getItem('lifeplan_state');
    if(raw){ Object.assign(state, JSON.parse(raw)); }
  }catch(e){}
}
// 古い保存データや共有リンクに新しめの項目が無くても動くよう、欠けているフィールドを補完する
function ensureStateDefaults(){
  const std = TEMPLATES.standard;
  state.profile   = Object.assign({}, std.profile,   {incomeGrowthRate:0}, state.profile);
  state.housing   = Object.assign({}, std.housing,   state.housing);
  state.lifestyle = Object.assign({}, std.lifestyle, state.lifestyle);
  state.retirement= Object.assign({}, std.retirement,state.retirement);
  state.investment= Object.assign({}, std.investment,{pmtOverride:null}, state.investment);
  if(!Array.isArray(state.children)) state.children = [];
  state.children.forEach(c=>{
    if(!c.stages) c.stages = {...(EDU_TRACK_PRESETS[c.track]||EDU_TRACK_PRESETS.public)};
  });
}

/* =====================================================================
   C. 純粋な財務計算関数
===================================================================== */
function inflate(amount, years, rate){ return amount * Math.pow(1+rate, years); }
function realValue(nominalAmount, years, inflationRate){ return nominalAmount / Math.pow(1+inflationRate, years); }
function fisherReal(rNominal, inflation){ return (1+rNominal)/(1+inflation) - 1; }

function amortizationPayment(principal, annualRate, years){
  const n = years*12, i = annualRate/12;
  if(principal<=0 || n<=0) return 0;
  if(i===0) return principal/n;
  return principal * i / (1 - Math.pow(1+i, -n));
}
function pvAnnuity(pmt, i, n){
  if(n<=0) return 0;
  if(i===0) return pmt*n;
  return pmt*(1-Math.pow(1+i,-n))/i;
}
function fvAnnuity(pmt, i, n){
  if(n<=0) return 0;
  if(i===0) return pmt*n;
  return pmt*((Math.pow(1+i,n)-1)/i);
}
function pmtFromPV(pv, i, n){
  if(n<=0) return 0;
  if(i===0) return pv/n;
  return pv * i / (1 - Math.pow(1+i,-n));
}

/* =====================================================================
   D. ドメイン別計算
===================================================================== */
function getChildStages(child){
  if(child.stages) return child.stages;
  return EDU_TRACK_PRESETS[child.track] || EDU_TRACK_PRESETS.public;
}
function getChildEducationCostForAge(child, age, yearsFromNow, inflationRate){
  const stages = getChildStages(child);
  let cost = 0;
  for(const key of ['kindergarten','elementary','juniorHigh','highSchool']){
    const stage = EDUCATION_COSTS[key];
    if(age>=stage.startAge && age<stage.startAge+stage.years){
      cost += stages[key]==='private' ? stage.private : stage.public;
    }
  }
  const uniKey = stages.university;
  if(uniKey && uniKey!=='none' && UNIVERSITY_COSTS[uniKey] && age>=UNIVERSITY_COSTS.startAge && age<UNIVERSITY_COSTS.startAge+UNIVERSITY_COSTS.years){
    const uni = UNIVERSITY_COSTS[uniKey];
    cost += uni.annual;
    if(age===UNIVERSITY_COSTS.startAge) cost += uni.entrance;
  }
  return inflate(cost, yearsFromNow, inflationRate);
}

function getHousingCostForYear(t, parentAge, s){
  const h = s.housing;
  if(h.tenure==='rent'){
    const region = REGION_INFO[h.region];
    // 職住距離の許容度を家賃係数に反映: 近距離重視+15% 〜 郊外でも可-15%
    const commuteFactor = 1.15 - 0.3*s.lifestyle.commute;
    const monthlyRent = region.rentPerSqm * h.sizeSqm * commuteFactor;
    return inflate(monthlyRent*12, t, s.investment.inflationRate);
  } else {
    const principal = Math.max(h.purchasePrice - h.downPayment, 0);
    const monthlyPay = amortizationPayment(principal, h.loanRate/100, h.loanYears);
    if(t < h.loanYears){
      return monthlyPay*12; // 固定名目返済額（再インフレ調整なし）
    }else{
      // ローン完済後は固定資産税・維持費の概算(購入価格の0.6%/年、名目で購入時点固定 → 以後インフレ連動)
      const maintenance = h.purchasePrice*0.006;
      return inflate(maintenance, t, s.investment.inflationRate);
    }
  }
}

function getRetirementCostForYear(t, s){
  const monthly = RETIREMENT_MIN_MONTHLY + (RETIREMENT_COMFORT_MONTHLY-RETIREMENT_MIN_MONTHLY)*s.retirement.level;
  return inflate(monthly*12, t, s.investment.inflationRate);
}

function getPensionForYear(t, s){
  const monthly = s.retirement.pensionType==='model' ? PENSION_MODEL_COUPLE_MONTHLY : PENSION_BASIC_FULL_MONTHLY*2;
  return inflate(monthly*12, t, s.investment.inflationRate);
}

function getLivingCostForYear(t, s){
  const luxuryMultiplier = 0.85 + s.lifestyle.luxury*0.5; // 0→0.85倍(質素) 〜 1→1.35倍(贅沢)
  const diningExtra = s.lifestyle.diningOutPerWeek * 4.3 * 3500 * 12; // 週回数 x 月平均4.3週 x 1回3500円 x 12月
  const base = BASELINE_LIVING_MONTHLY*12*luxuryMultiplier + diningExtra;
  return inflate(base, t, s.investment.inflationRate);
}

/* =====================================================================
   E. 年次タイムライン構築
===================================================================== */
function buildTimeline(s){
  const horizonAge = 100;
  const n = horizonAge - s.profile.currentAge;
  const timeline = [];
  for(let t=0;t<=n;t++){
    const age = s.profile.currentAge + t;
    const isRetired = age >= s.retirement.retireAge;
    const incomeNominal = isRetired ? getPensionForYear(t,s) : s.profile.currentIncome * Math.pow(1+(s.profile.incomeGrowthRate||0), t);
    const livingNominal = isRetired ? getRetirementCostForYear(t,s) : getLivingCostForYear(t,s);
    const housingNominal = isRetired ? 0 : getHousingCostForYear(t, age, s);
    let eduNominal = 0;
    for(const child of s.children){
      const cAge = age - child.birthParentAge;
      if(cAge>=0) eduNominal += getChildEducationCostForAge(child, cAge, t, s.investment.inflationRate);
    }
    const expense = livingNominal + housingNominal + eduNominal;
    const netCashflow = incomeNominal - expense;
    timeline.push({ t, age, calendarYear: new Date().getFullYear()+t, isRetired, incomeNominal, expense, livingNominal, housingNominal, eduNominal, netCashflow, requiredIncomeGross: expense / s.investment.netIncomeRatio });
  }
  return timeline;
}

function deriveStageBoundaries(s){
  const stages = [];
  stages.push({ age: s.profile.currentAge, label:'📍現在' });
  if(s.profile.marriageAge>s.profile.currentAge) stages.push({ age:s.profile.marriageAge, label:'💍結婚' });
  s.children.forEach((c,i)=> stages.push({ age:c.birthParentAge, label:`👶第${i+1}子誕生` }));
  s.children.forEach((c,i)=>{
    if(getChildStages(c).university!=='none') stages.push({ age:c.birthParentAge+18, label:`🎓第${i+1}子 大学入学` });
  });
  stages.push({ age:s.retirement.retireAge, label:'🌅退職' });
  return stages.filter(x=>x.age>=s.profile.currentAge).sort((a,b)=>a.age-b.age);
}

/* =====================================================================
   F. 集計
===================================================================== */
function computeLifetimeTotals(timeline){
  let totalNominal=0;
  for(const row of timeline) totalNominal += Math.max(-row.netCashflow,0);
  return { totalNominal };
}
function computeFundingGapPV(timeline, s){
  // 黒字年の余剰も相殺した生涯純キャッシュフローの現在価値。
  // 赤字年だけを合算するとPMTが過大になり、積立ロールフォワードの残高が0に収束しない(整合性が崩れる)ため、
  // 全期間のnetCashflowを符号込みで合算する。指数はt+1(simulateNetWorthが各年の複利計算後にnetCashflowを
  // 反映する時点=年末タイミング)に合わせる。
  const r = s.investment.returnRate;
  let pv=0;
  for(const row of timeline) pv += (-row.netCashflow) / Math.pow(1+r, row.t+1);
  return Math.max(pv - s.profile.currentSavings, 0);
}
function computeRequiredMonthlyInvestment(gapPV, s){
  // simulateNetWorthは積立額を年1回(pmt*12)・年次複利で反映するため、年次の定額年金として解く
  // (月次複利で解くと積立ロールフォワードの前提と食い違い、整合性チェックの残高が0に収束しない)。
  const n = Math.max(s.retirement.retireAge - s.profile.currentAge, 1);
  const annualPmt = pmtFromPV(gapPV, s.investment.returnRate, n);
  return annualPmt/12;
}
function simulateNetWorth(timeline, pmt, s){
  const r = s.investment.returnRate;
  let balance = s.profile.currentSavings;
  const series=[];
  for(const row of timeline){
    const contributing = row.age < s.retirement.retireAge;
    balance = balance*(1+r) + (contributing? pmt*12:0) + row.netCashflow;
    series.push({ age:row.age, balance });
  }
  return series;
}
function depletionAge(netWorthSeries){
  const first = netWorthSeries.find(p=>p.balance<0);
  return first ? first.age : null;
}
function computeMetrics(s){
  const timeline = buildTimeline(s);
  const totals = computeLifetimeTotals(timeline);
  const gapPV = computeFundingGapPV(timeline, s);
  const pmt = computeRequiredMonthlyInvestment(gapPV, s);
  return { timeline, totals, gapPV, pmt };
}
function findPeakIncomeYear(timeline, s){
  let peak = timeline[0];
  for(const row of timeline){
    if(row.age < s.retirement.retireAge && row.requiredIncomeGross > peak.requiredIncomeGross) peak = row;
  }
  return peak;
}
// 「どの選択が必要額を押し上げているか」: 選択項目をベースライン(より質素な選択)に置き換えて再計算し、差分を出す
function computeAttributions(s, baseMetrics){
  const items = [];
  function diff(label, tab, mutate){
    const clone = JSON.parse(JSON.stringify(s));
    mutate(clone);
    const m = computeMetrics(clone);
    const dPmt = baseMetrics.pmt - m.pmt;
    const dGap = baseMetrics.gapPV - m.gapPV;
    if(dPmt > 500) items.push({ label, tab, dPmt, dGap });
  }
  if(s.housing.tenure==='rent' && s.housing.region!=='otherRegion'){
    diff(`${REGION_INFO[s.housing.region].label}に住む（その他地方と比べて）`, 'housing', c=>{ c.housing.region='otherRegion'; });
  }
  if(s.housing.tenure==='own'){
    diff('持ち家の購入（同地域の賃貸と比べて）', 'housing', c=>{ c.housing.tenure='rent'; });
  }
  s.children.forEach((child, i)=>{
    const stages = getChildStages(child);
    const isBaseline = ['kindergarten','elementary','juniorHigh','highSchool'].every(k=>stages[k]==='public') && stages.university==='national';
    if(!isBaseline){
      diff(`第${i+1}子の進学プラン（すべて公立・国公立大と比べて）`, 'family', c=>{ c.children[i].track='public'; c.children[i].stages = {...EDU_TRACK_PRESETS.public}; });
    }
  });
  if(s.lifestyle.luxury > 0.55){
    diff('生活の贅沢度（「標準」と比べて）', 'housing', c=>{ c.lifestyle.luxury = 0.5; });
  }
  if(s.lifestyle.diningOutPerWeek > 0){
    diff(`外食・中食 週${s.lifestyle.diningOutPerWeek}回（外食なしと比べて）`, 'housing', c=>{ c.lifestyle.diningOutPerWeek = 0; });
  }
  if(s.retirement.level > 0.05){
    diff('老後のゆとり（最低日常生活費と比べて）', 'retirement', c=>{ c.retirement.level = 0; });
  }
  items.sort((a,b)=>b.dPmt-a.dPmt);
  return items;
}

/* =====================================================================
   G. 描画
===================================================================== */
function fmtYen(v){
  if(Math.abs(v)>=1e8) return (v/1e8).toFixed(2)+'億円';
  if(Math.abs(v)>=1e4) return Math.round(v/1e4).toLocaleString()+'万円';
  return Math.round(v).toLocaleString()+'円';
}
function svgEl(tag, attrs){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function scaleLinear(domain, range){
  const [d0,d1]=domain, [r0,r1]=range;
  return function(v){ return r0 + (v-d0)/(d1-d0||1) * (r1-r0); };
}

function renderLineChart(container, series, opts){
  const w=opts.width||640, h=opts.height||220, pad={l:60,r:20,t:16,b:28};
  container.innerHTML='';
  const svg = svgEl('svg',{class:'chart', width:w, height:h, viewBox:`0 0 ${w} ${h}`});
  const xs = series.map(p=>p.age);
  const allVals = [].concat(...opts.lines.map(l=>series.map(p=>p[l.key])));
  const yMin = Math.min(0, ...allVals), yMax = Math.max(...allVals, 1);
  const x = scaleLinear([Math.min(...xs), Math.max(...xs)], [pad.l, w-pad.r]);
  const y = scaleLinear([yMin, yMax], [h-pad.b, pad.t]);
  const g = svgEl('g',{class:'axis'});
  // gridlines + y ticks
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const val = yMin + (yMax-yMin)*i/ticks;
    const yy = y(val);
    g.appendChild(svgEl('line',{class:'gridline', x1:pad.l, x2:w-pad.r, y1:yy, y2:yy}));
    const t = svgEl('text',{x:pad.l-6, y:yy+3, 'text-anchor':'end'}); t.textContent = fmtYen(val); g.appendChild(t);
  }
  // x ticks (every ~10 years)
  for(let i=0;i<xs.length;i+=Math.max(1,Math.round(xs.length/8))){
    const xx = x(xs[i]);
    const t = svgEl('text',{x:xx, y:h-6, 'text-anchor':'middle'}); t.textContent = xs[i]+'歳'; g.appendChild(t);
  }
  svg.appendChild(g);
  opts.lines.forEach(line=>{
    let d='';
    series.forEach((p,i)=>{ d += (i===0?'M':'L') + x(p.age) + ' ' + y(p[line.key]) + ' '; });
    svg.appendChild(svgEl('path',{d, fill:'none', stroke:line.color, 'stroke-width':2}));
  });
  // stage markers
  (opts.markers||[]).forEach(m=>{
    const xx = x(m.age);
    svg.appendChild(svgEl('line',{x1:xx,x2:xx,y1:pad.t,y2:h-pad.b, stroke:'var(--text-dim)','stroke-dasharray':'2,3'}));
  });
  // hover
  attachChartHover(svg, {w, pad, xs, series, labelFn: (closest)=> closest.age+'歳: ' + opts.lines.map(l=>l.label+' '+fmtYen(closest[l.key])).join(' / ')});
  container.appendChild(svg);
  if(opts.legend){
    container.appendChild(buildLegend(opts.lines.map(l=>({label:l.label, color:l.color}))));
  }
}

// タッチ・マウス両対応のホバー層(pointerイベント)
function attachChartHover(svg, cfg){
  const {w, pad, xs, series, labelFn} = cfg;
  const tooltip = document.getElementById('tooltip');
  const handler = (e)=>{
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX-rect.left) * (w/rect.width); // 表示スケールをviewBox座標に補正
    const age = Math.round(scaleLinear([pad.l,w-pad.r],[Math.min(...xs),Math.max(...xs)])(mx));
    const closest = series.reduce((a,b)=> Math.abs(b.age-age)<Math.abs(a.age-age)?b:a);
    tooltip.style.display='block';
    tooltip.style.left = Math.min(e.clientX+12, window.innerWidth-290)+'px';
    tooltip.style.top = e.clientY+12+'px';
    tooltip.textContent = labelFn(closest);
  };
  svg.addEventListener('pointermove', handler);
  svg.addEventListener('pointerdown', handler);
  svg.addEventListener('pointerleave', ()=>{ tooltip.style.display='none'; });
}

function buildLegend(items){
  const div = document.createElement('div'); div.className='legend';
  items.forEach(it=>{
    const span = document.createElement('span');
    const sw = document.createElement('span'); sw.className='swatch'; sw.style.background = it.color;
    span.appendChild(sw); span.appendChild(document.createTextNode(it.label));
    div.appendChild(span);
  });
  return div;
}

// 支出内訳の積み上げエリアチャート(生活費/住居費/教育費)
function renderStackedAreaChart(container, timeline, opts){
  const w=(opts&&opts.width)||640, h=(opts&&opts.height)||220, pad={l:60,r:20,t:16,b:28};
  container.innerHTML='';
  const bands = [
    { key:'livingNominal',  label:'生活費(老後含む)', color:'var(--series-living)' },
    { key:'housingNominal', label:'住居費',           color:'var(--series-housing)' },
    { key:'eduNominal',     label:'教育費',           color:'var(--series-edu)' },
  ];
  const svg = svgEl('svg',{class:'chart', width:w, height:h, viewBox:`0 0 ${w} ${h}`});
  const xs = timeline.map(p=>p.age);
  // 累積値を計算
  const cums = timeline.map(row=>{
    let acc=0; return bands.map(b=>{ acc += row[b.key]; return acc; });
  });
  const yMax = Math.max(...cums.map(c=>c[c.length-1]), 1);
  const x = scaleLinear([Math.min(...xs), Math.max(...xs)], [pad.l, w-pad.r]);
  const y = scaleLinear([0, yMax], [h-pad.b, pad.t]);
  const g = svgEl('g',{class:'axis'});
  for(let i=0;i<=4;i++){
    const val = yMax*i/4, yy = y(val);
    g.appendChild(svgEl('line',{class:'gridline', x1:pad.l, x2:w-pad.r, y1:yy, y2:yy}));
    const t = svgEl('text',{x:pad.l-6, y:yy+3, 'text-anchor':'end'}); t.textContent = fmtYen(val); g.appendChild(t);
  }
  for(let i=0;i<xs.length;i+=Math.max(1,Math.round(xs.length/8))){
    const t = svgEl('text',{x:x(xs[i]), y:h-6, 'text-anchor':'middle'}); t.textContent = xs[i]+'歳'; g.appendChild(t);
  }
  svg.appendChild(g);
  bands.forEach((band, bi)=>{
    let d='';
    timeline.forEach((row,i)=>{ d += (i===0?'M':'L') + x(row.age) + ' ' + y(cums[i][bi]) + ' '; });
    for(let i=timeline.length-1;i>=0;i--){ d += 'L' + x(timeline[i].age) + ' ' + y(bi===0?0:cums[i][bi-1]) + ' '; }
    d += 'Z';
    // 帯同士の境界にサーフェス色のストロークを入れて塗りを区切る
    svg.appendChild(svgEl('path',{d, fill:band.color, 'fill-opacity':0.85, stroke:'var(--panel)', 'stroke-width':1.5}));
  });
  attachChartHover(svg, {w, pad, xs, series: timeline, labelFn:(row)=> row.age+'歳: ' + bands.map(b=>b.label+' '+fmtYen(row[b.key])).join(' / ')});
  container.appendChild(svg);
  container.appendChild(buildLegend(bands));
}

function renderBarChart(container, series, opts){
  const w=opts.width||640, h=opts.height||180, pad={l:60,r:20,t:16,b:28};
  container.innerHTML='';
  const svg = svgEl('svg',{class:'chart', width:w, height:h, viewBox:`0 0 ${w} ${h}`});
  const xs = series.map(p=>p.age);
  const vals = series.map(p=>p[opts.key]);
  const yMax = Math.max(...vals.map(Math.abs), 1);
  const x = scaleLinear([Math.min(...xs), Math.max(...xs)], [pad.l, w-pad.r]);
  const y = scaleLinear([-yMax, yMax], [h-pad.b, pad.t]);
  const zeroY = y(0);
  const barW = Math.max((w-pad.l-pad.r)/xs.length - 1, 1);
  series.forEach(p=>{
    const val = p[opts.key];
    const yy = y(Math.max(val,0));
    const bh = Math.abs(y(val)-zeroY);
    svg.appendChild(svgEl('rect',{ x:x(p.age)-barW/2, y: val>=0?yy:zeroY, width:barW, height:Math.max(bh,0.5), fill: val>=0?'var(--good)':'var(--bad)' }));
  });
  svg.appendChild(svgEl('line',{x1:pad.l,x2:w-pad.r,y1:zeroY,y2:zeroY,stroke:'var(--border)'}));
  container.appendChild(svg);
}

/* =====================================================================
   計算オーケストレーション + 描画更新
===================================================================== */
function recompute(){
  const warnEl0 = document.getElementById('nisa-warning');
  if(state.retirement.retireAge <= state.profile.currentAge){
    warnEl0.innerHTML = '<div class="warn-box danger">退職年齢は現在の年齢より後に設定してください。この条件では計算できません。</div>';
    ['kpi-gap','kpi-pmt','kpi-income'].forEach(id=>document.getElementById(id).textContent='-');
    return;
  }
  const metrics = computeMetrics(state);
  const { timeline, totals, gapPV, pmt } = metrics;
  const currentRow = timeline[0];

  document.getElementById('kpi-income').textContent = fmtYen(currentRow.requiredIncomeGross);
  document.getElementById('kpi-income-sub').textContent = '現在の年収 '+fmtYen(state.profile.currentIncome)+' との差 '+fmtYen(currentRow.requiredIncomeGross-state.profile.currentIncome);
  document.getElementById('kpi-pmt').textContent = fmtYen(pmt)+'/月';
  document.getElementById('kpi-gap').textContent = fmtYen(gapPV);

  const annualPmt = pmt*12;
  const warnEl = document.getElementById('nisa-warning');
  if(annualPmt > NISA_LIMITS.combinedAnnual){
    warnEl.innerHTML = `<div class="warn-box danger">必要積立額(年間${fmtYen(annualPmt)})が新NISA併用枠上限(年360万円)を超えています。超過分は課税口座での運用が必要です。</div>`;
  } else if(annualPmt > NISA_LIMITS.tsumitateAnnual){
    warnEl.innerHTML = `<div class="warn-box">必要積立額(年間${fmtYen(annualPmt)})はつみたて投資枠(年120万円)を超えるため、成長投資枠(年240万円)の併用が必要です。</div>`;
  } else {
    warnEl.innerHTML = '';
  }

  if(document.getElementById('step-results').classList.contains('active')){
    renderResults(metrics);
  }
  persistState();
}

function renderResults(metrics){
  const { timeline, totals, gapPV, pmt } = metrics;
  const currentRow = timeline[0];
  const attrs = computeAttributions(state, metrics);

  // ヒーロー: 必要年収が主役
  document.getElementById('hero-income-now').textContent = fmtYen(currentRow.requiredIncomeGross);
  const peak = findPeakIncomeYear(timeline, state);
  document.getElementById('hero-income-sub').textContent =
    `ピークは${peak.age}歳ごろの${fmtYen(peak.requiredIncomeGross)}/年です。`;

  // 達成度ゲージ: 現在の年収が必要年収をどれだけカバーしているか
  const coverage = currentRow.requiredIncomeGross>0 ? state.profile.currentIncome/currentRow.requiredIncomeGross : 1;
  const fill = document.getElementById('hero-gauge-fill');
  fill.style.width = Math.min(coverage*100, 100)+'%';
  fill.className = 'fill ' + (coverage>=1 ? '' : coverage>=0.8 ? 'warn' : 'low');
  const msgEl = document.getElementById('hero-gauge-msg');
  if(coverage>=1){
    msgEl.textContent = `🎉 いまの年収(${fmtYen(state.profile.currentIncome)})で、現在の理想の暮らしに手が届いています！`;
  }else if(coverage>=0.8){
    msgEl.textContent = `あと一歩！ いまの年収(${fmtYen(state.profile.currentIncome)})で必要額の${Math.round(coverage*100)}%をカバーできています。`;
  }else{
    msgEl.textContent = `いまの年収(${fmtYen(state.profile.currentIncome)})で必要額の${Math.round(coverage*100)}%。伸びしろ十分、下の「次のアクション」から始めましょう。`;
  }

  renderMonthlyBudget(metrics);
  renderNextActions(metrics, attrs);

  document.getElementById('result-gap-pv').textContent = fmtYen(gapPV);
  document.getElementById('result-pmt').textContent = fmtYen(pmt)+' / 月';
  document.getElementById('result-total-nominal').textContent = fmtYen(totals.totalNominal);

  renderLineChart(document.getElementById('income-chart'), timeline, {
    lines:[ {key:'requiredIncomeGross', label:'必要年収(概算)', color:'var(--bad)'}, {key:'incomeNominal', label:'想定収入', color:'var(--accent)'} ],
    markers: deriveStageBoundaries(state),
    legend: true,
  });

  renderStackedAreaChart(document.getElementById('breakdown-chart'), timeline);

  renderAttributions(attrs);

  renderBarChart(document.getElementById('cashflow-chart'), timeline, { key:'netCashflow' });

  renderNetWorthSection(metrics);

  const stages = deriveStageBoundaries(state);
  const tbody = document.getElementById('stage-table-body');
  tbody.innerHTML='';
  stages.forEach(st=>{
    const row = timeline.find(r=>r.age===st.age) || timeline[timeline.length-1];
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${st.label}(${st.age}歳)</td><td>${fmtYen(row.requiredIncomeGross)}</td><td>${fmtYen(row.incomeNominal)}</td><td>${fmtYen(row.requiredIncomeGross-row.incomeNominal)}</td>`
      + `<td>${fmtYen(row.livingNominal)}</td><td>${fmtYen(row.housingNominal)}</td><td>${fmtYen(row.eduNominal)}</td>`;
    tbody.appendChild(tr);
  });

  renderScenarioSection(metrics);
}

// 毎月の家計イメージ(現在時点): 抽象的な年額・生涯額を、毎月のお財布の姿に翻訳する
function fmtMan1(v){
  if(Math.abs(v)>=10000) return (v/10000).toFixed(1).replace(/\.0$/,'')+'万円';
  return Math.round(v).toLocaleString()+'円';
}
function renderMonthlyBudget(metrics){
  const { timeline, pmt } = metrics;
  const row = timeline[0];
  const netMonthly = state.profile.currentIncome * state.investment.netIncomeRatio / 12;
  const items = [
    { emoji:'💵', label:'手取り月収（いまの年収から）', v:netMonthly, color:'var(--good)' },
    { emoji:'🍚', label:'生活費', v:row.livingNominal/12, color:'var(--series-living)' },
    { emoji:'🏠', label:'住居費', v:row.housingNominal/12, color:'var(--series-housing)' },
    { emoji:'🎓', label:'教育費', v:row.eduNominal/12, color:'var(--series-edu)' },
    { emoji:'💰', label:'未来への積立（必要額）', v:pmt, color:'var(--accent)' },
  ].filter(it=>it.v>0 || it.emoji==='💵');
  const maxV = Math.max(...items.map(i=>i.v), 1);
  const outgo = row.livingNominal/12 + row.housingNominal/12 + row.eduNominal/12 + pmt;
  const balance = netMonthly - outgo;
  const card = document.getElementById('monthly-budget');
  let html = '';
  items.forEach(it=>{
    html += `<div class="budget-row"><span>${it.emoji} ${it.label}</span><span class="amount">${fmtMan1(it.v)}</span>`
      + `<span class="bar"><i style="width:${Math.max(it.v/maxV*100,2)}%;background:${it.color}"></i></span></div>`;
  });
  if(balance>=0){
    html += `<div class="budget-total good">今月の残り: +${fmtMan1(balance)} 🎉 余裕があります</div>`;
  }else{
    html += `<div class="budget-total bad">今月の足りない分: ${fmtMan1(balance)}</div>`
      + `<p class="hint">年収を上げる・積立を減らして期間を延ばす・理想を少し調整する、のどれかで埋められます(下の「次のアクション」へ)。</p>`;
  }
  card.innerHTML = html;
}

// 結果から逆算した、具体的な次の一手

  const { timeline, pmt } = metrics;

  const container = document.getElementById('next-actions');
  const actions = [];

  if(pmt > 0){
    const annual = pmt*12;
    let nisaNote;
    if(annual <= NISA_LIMITS.tsumitateAnnual) nisaNote = 'NISAのつみたて投資枠(年120万円)だけで足ります。';
    else if(annual <= NISA_LIMITS.combinedAnnual) nisaNote = 'NISAのつみたて枠+成長投資枠の併用でカバーできます。';
    else nisaNote = 'NISA枠(年360万円)を超える分は課税口座での運用になります。';
    actions.push({
      title: `毎月${fmtMan1(pmt)}の自動積立を設定する`,
      desc: `証券口座で毎月自動で積み立てる設定にするのが最初の一歩。${nisaNote}`,
      btnLabel: '積立額をスライダーで試す', btnAction: ()=>{ document.getElementById('pmt-override-control').scrollIntoView({behavior:'smooth', block:'center'}); },
    });
  }

  const incomeGap = row.requiredIncomeGross - state.profile.currentIncome;
  if(incomeGap > 0){
    actions.push({
      title: `年収を${fmtYen(incomeGap)}上げる道を探す`,
      desc: `昇進・転職・副業などで理想の暮らしにまっすぐ近づけます。「基本情報 > 詳細設定」で昇給率を入れると、将来の昇給込みのプランも試せます。`,
      btnLabel: '基本情報で年収を変えてみる', btnAction: ()=>setActiveStep('profile'),
    });
  }

  if(attrs.length > 0){
    const top = attrs[0];
    const tabLabels = { housing:'住居・生活', family:'家族・教育', retirement:'老後' };
    actions.push({
      title: 'ゆずれる所がないか、少しだけ試してみる',
      desc: `いちばん効くのは「${top.label}」で、見直すと毎月${fmtMan1(top.dPmt)}軽くなります。決める必要はありません、スライダーで動かして眺めるだけでOK。`,
      btnLabel: `「${tabLabels[top.tab]||'入力'}」タブで試す`, btnAction: ()=>setActiveStep(top.tab),
    });
  }

  actions.push({
    title: 'このプランに名前を付けて保存する',
    desc: '「東京私立プラン」「地方でのんびりプラン」のように保存しておくと、あとで並べて比較できます。迷ったら両方保存!',
    btnLabel: 'シナリオ保存へ', btnAction: ()=>{ document.getElementById('scenario-section').scrollIntoView({behavior:'smooth', block:'center'}); },
  });

  container.innerHTML='';
  actions.forEach((a, i)=>{
    const card = document.createElement('div'); card.className='action-card';
    card.innerHTML = `<span class="num">${i+1}</span><div class="body"><p><strong>${a.title}</strong></p><p class="hint">${a.desc}</p></div>`;
    const btn = document.createElement('button'); btn.className='btn secondary'; btn.type='button'; btn.textContent=a.btnLabel;
    btn.addEventListener('click', a.btnAction);
    card.querySelector('.body').appendChild(btn);
    container.appendChild(card);
  });
}

function renderAttributions(items){
  const container = document.getElementById('attribution-section');
  if(items.length===0){ container.innerHTML='<p class="hint">押し上げ要因はありません(すべて最も質素な選択になっています)。</p>'; return; }
  let html = '<div class="chart-wrap"><table class="attribution-table"><thead><tr><th>選択</th><th>月次積立への影響</th><th>生涯ギャップへの影響</th></tr></thead><tbody>';
  items.forEach(it=>{
    html += `<tr><td>${it.label}</td><td class="delta">+${fmtYen(it.dPmt)}/月</td><td class="delta">+${fmtYen(it.dGap)}</td></tr>`;
  });
  html += '</tbody></table></div><p class="hint">※各行は「その選択だけをより質素な基準に戻した場合」との差分です(個別比較のため、合計は全体と一致しません)。</p>';
  container.innerHTML = html;
}

function renderNetWorthSection(metrics){
  const { timeline, pmt } = metrics;
  const effectivePmt = state.investment.pmtOverride!=null ? state.investment.pmtOverride : pmt;
  const netWorth = simulateNetWorth(timeline, effectivePmt, state);
  renderLineChart(document.getElementById('networth-chart'), netWorth, { lines:[ {key:'balance', label:'純資産残高', color:'var(--good)'} ] });

  const msgEl = document.getElementById('pmt-override-message');
  if(state.investment.pmtOverride!=null){
    const dep = depletionAge(netWorth);
    if(dep!=null){
      msgEl.innerHTML = `<div class="warn-box danger">月${fmtYen(effectivePmt)}の積立では、<strong>${dep}歳で資産が尽きる</strong>見込みです(必要額は月${fmtYen(pmt)})。</div>`;
    }else{
      const last = netWorth[netWorth.length-1];
      msgEl.innerHTML = `<div class="warn-box">月${fmtYen(effectivePmt)}の積立なら、100歳時点で約${fmtYen(last.balance)}の余裕があります。</div>`;
    }
  }else{
    msgEl.innerHTML = '<p class="hint">算出した必要額どおりに積み立てた場合、資産は計画期間の最後でちょうど使い切る設計です。</p>';
  }

  const ctl = document.getElementById('pmt-override-control');
  // ドラッグ操作中(フォーカスがコントロール内にある間)は作り直さない — 再構築するとドラッグが途切れる
  if(ctl.contains(document.activeElement) && document.activeElement!==document.body) return;
  ctl.innerHTML='';
  const maxPmt = Math.max(Math.ceil(pmt*2/10000)*10000, 300000);
  ctl.appendChild(sliderField('実際に積み立てる額(試す)', effectivePmt, 0, maxPmt, 5000,
    v=>fmtYen(v)+'/月',
    v=>{ state.investment.pmtOverride = v; }, {left:'0円', right:fmtYen(maxPmt)}));
  const resetBtn = document.createElement('button');
  resetBtn.className='btn secondary'; resetBtn.type='button'; resetBtn.textContent='必要額に戻す';
  resetBtn.addEventListener('click', ()=>{ state.investment.pmtOverride = null; recompute(); });
  ctl.appendChild(resetBtn);
}

/* ===== シナリオ保存・比較 / URL共有 ===== */
function getScenarios(){ try{ return JSON.parse(localStorage.getItem('lifeplan_scenarios')||'[]'); }catch(e){ return []; } }
function saveScenarios(list){ try{ localStorage.setItem('lifeplan_scenarios', JSON.stringify(list)); }catch(e){} }

function snapshotState(){
  return JSON.parse(JSON.stringify({
    profile: state.profile, housing: state.housing, lifestyle: state.lifestyle,
    children: state.children, retirement: state.retirement, investment: state.investment,
  }));
}

function renderScenarioSection(metrics, force){
  const container = document.getElementById('scenario-section');
  // 名前入力中の再計算で入力欄を消さない(保存・削除ボタンからの明示的な再描画は force で通す)
  if(!force && container.contains(document.activeElement) && document.activeElement!==document.body) return;
  container.innerHTML='';

  const bar = document.createElement('div'); bar.className='scenario-bar';
  const nameInput = document.createElement('input'); nameInput.type='text'; nameInput.placeholder='シナリオ名(例: 東京私立プラン)'; nameInput.style.flex='1 1 200px';
  const saveBtn = document.createElement('button'); saveBtn.className='btn'; saveBtn.type='button'; saveBtn.textContent='現在の入力を保存';
  saveBtn.addEventListener('click', ()=>{
    const list = getScenarios();
    list.push({ name: nameInput.value.trim() || `シナリオ${list.length+1}`, savedAt: Date.now(), state: snapshotState() });
    saveScenarios(list);
    nameInput.value='';
    renderScenarioSection(metrics, true);
  });
  const shareBtn = document.createElement('button'); shareBtn.className='btn secondary'; shareBtn.type='button'; shareBtn.textContent='共有用リンクをコピー';
  shareBtn.addEventListener('click', ()=>{
    const url = location.href.split('#')[0] + encodeStateToHash();
    const done = ()=>{ shareBtn.textContent='コピーしました ✓'; setTimeout(()=>{ shareBtn.textContent='共有用リンクをコピー'; }, 2000); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(()=>{ window.prompt('このリンクをコピーしてください', url); });
    }else{
      window.prompt('このリンクをコピーしてください', url);
    }
  });
  bar.appendChild(nameInput); bar.appendChild(saveBtn); bar.appendChild(shareBtn);
  container.appendChild(bar);

  const list = getScenarios();
  if(list.length===0){
    container.insertAdjacentHTML('beforeend', '<p class="hint">シナリオを保存すると、「東京私立プラン vs 地方公立プラン」のような比較ができます。</p>');
    return;
  }
  const wrap = document.createElement('div'); wrap.className='chart-wrap';
  const table = document.createElement('table');
  table.innerHTML = '<thead><tr><th>シナリオ</th><th>必要年収(現在)</th><th>必要月次積立</th><th>生涯ギャップ</th><th></th></tr></thead>';
  const tbody = document.createElement('tbody');
  // 先頭行は現在の入力
  const curTr = document.createElement('tr');
  curTr.innerHTML = `<td><strong>現在の入力</strong></td><td>${fmtYen(metrics.timeline[0].requiredIncomeGross)}</td><td>${fmtYen(metrics.pmt)}/月</td><td>${fmtYen(metrics.gapPV)}</td><td></td>`;
  tbody.appendChild(curTr);
  list.forEach((sc, idx)=>{
    let m = null;
    try{ m = computeMetrics(sc.state); }catch(e){}
    const tr = document.createElement('tr');
    const cells = m
      ? `<td>${fmtYen(m.timeline[0].requiredIncomeGross)}</td><td>${fmtYen(m.pmt)}/月</td><td>${fmtYen(m.gapPV)}</td>`
      : '<td colspan="3">計算できませんでした</td>';
    tr.innerHTML = `<td>${escapeHtml(sc.name)}</td>${cells}<td></td>`;
    const actions = tr.lastElementChild;
    const loadBtn = document.createElement('button'); loadBtn.className='btn secondary'; loadBtn.type='button'; loadBtn.textContent='読み込む'; loadBtn.style.marginRight='.3rem';
    loadBtn.addEventListener('click', ()=>{
      Object.assign(state, JSON.parse(JSON.stringify(sc.state)));
      ensureStateDefaults();
      rebuildAllSteps();
      setActiveStep('results');
    });
    const delBtn = document.createElement('button'); delBtn.className='btn secondary'; delBtn.type='button'; delBtn.textContent='削除';
    delBtn.addEventListener('click', ()=>{
      const l = getScenarios(); l.splice(idx,1); saveScenarios(l); renderScenarioSection(metrics, true);
    });
    actions.appendChild(loadBtn); actions.appendChild(delBtn);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  container.appendChild(wrap);
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function encodeStateToHash(){
  const json = JSON.stringify(snapshotState());
  return '#s=' + btoa(unescape(encodeURIComponent(json)));
}
function decodeStateFromHash(){
  if(!location.hash.startsWith('#s=')) return false;
  try{
    const json = decodeURIComponent(escape(atob(location.hash.slice(3))));
    const payload = JSON.parse(json);
    Object.assign(state, payload);
    return true;
  }catch(e){ return false; }
}

  let html = '<div class="step-nav-buttons">';
  html += prevId ? `<button class="btn secondary" onclick="setActiveStep('${prevId}')">← 戻る</button>` : '<span></span>';

function applyTemplate(key, userAge){
  const tpl = JSON.parse(JSON.stringify(TEMPLATES[key]));
  // 入力された年齢に合わせて結婚・出産などのライフイベントを平行移動する(退職年齢は据え置き)
  const shift = (userAge||tpl.profile.currentAge) - tpl.profile.currentAge;
  tpl.profile.currentAge += shift;
  if(tpl.profile.marriageAge) tpl.profile.marriageAge += shift;
  tpl.children.forEach(c=>{
    c.birthParentAge += shift;
    c.stages = {...EDU_TRACK_PRESETS[c.track]};
  });
  Object.assign(state, tpl);
  ensureStateDefaults();
  state.appliedTemplate = key;
  state.investment.pmtOverride = null;
}

function buildStartStep(){
  const el = document.createElement('section');

  const tplEmoji = { steady:'🌾', standard:'🏡', urban:'🏙️' };
  let cards = '<div class="template-cards">';
  for(const key in TEMPLATES){

    cards += `<button type="button" class="template-card" data-template="${key}"><h3>${tplEmoji[key]||''} ${tpl.label}</h3><p>${tpl.desc}</p></button>`;

function infoIcon(text){
  const s = document.createElement('span'); s.className='info'; s.textContent='?'; s.tabIndex=0;
  const tt = ()=>document.getElementById('tooltip');
  const show = ()=>{
    const r = s.getBoundingClientRect();
    const el = tt();
    el.textContent = text;
    el.style.display='block';
    el.style.left = Math.max(8, Math.min(r.left, window.innerWidth-290))+'px';
    el.style.top = (r.bottom+6)+'px';
  };
  const hide = ()=>{ tt().style.display='none'; };
  s.addEventListener('pointerenter', show);
  s.addEventListener('pointerleave', hide);
  s.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); tt().style.display==='block' ? hide() : show(); });
  return s;
}

function numField(label, value, onChange, opts={}){
  // opts.unit=10000 で万円単位入力(内部状態は円のまま)。opts.info で用語解説アイコンを付ける。
  const wrap = document.createElement('div'); wrap.className='field';
  const lab = document.createElement('label'); lab.textContent = label;
  if(opts.info) lab.appendChild(infoIcon(opts.info));
  wrap.appendChild(lab);
  const unit = opts.unit || 1;
  const input = document.createElement('input'); input.type='number';
  input.value = unit===1 ? value : +(value/unit).toFixed(2);
  if(opts.step) input.step = opts.step;
  input.addEventListener('input', ()=>{ onChange((parseFloat(input.value)||0)*unit); recompute(); });
  wrap.appendChild(input);
  return wrap;
}

function sliderField(label, value, min, max, step, valueLabelFn, onChange, ends){
  ends = ends || { left:'少なめ', right:'多め' };
  const wrap = document.createElement('div'); wrap.className='slider-field';
  const lab = document.createElement('label'); lab.innerHTML = `${label}: <span class="slider-value">${valueLabelFn(value)}</span>`;
  wrap.appendChild(lab);
  const input = document.createElement('input'); input.type='range'; input.min=min; input.max=max; input.step=step; input.value=value;
  input.addEventListener('input', ()=>{
    const v = parseFloat(input.value);
    lab.querySelector('.slider-value').textContent = valueLabelFn(v);
    onChange(v); recompute();
  });
  wrap.appendChild(input);
  wrap.appendChild(Object.assign(document.createElement('div'), {className:'slider-labels', innerHTML:`<span>${ends.left}</span><span>${ends.right}</span>`}));
  return wrap;
}

function advancedSection(labelText){
  const btn = document.createElement('button'); btn.type='button'; btn.className='toggle-advanced'; btn.textContent='▸ '+(labelText||'詳細設定');
  const panel = document.createElement('div'); panel.className='advanced-panel';
  btn.addEventListener('click', ()=>{
    panel.classList.toggle('open');
    btn.textContent = (panel.classList.contains('open')?'▾ ':'▸ ')+(labelText||'詳細設定');
  });
  return { btn, panel };
}

  adv.panel.appendChild(advRow);
  el.appendChild(adv.btn); el.appendChild(adv.panel);
  el.insertAdjacentHTML('beforeend', stepNavButtons('start','housing'));
  return el;
}

function buildHousingStep(){
  const el = document.createElement('section'); el.className='step'; el.id='step-housing';
  el.innerHTML = '<h2>住居・生活</h2>';
  const tenureRow = document.createElement('div'); tenureRow.className='field';
  tenureRow.innerHTML = '<label>賃貸・持ち家</label>';
  const radios = document.createElement('div'); radios.className='radio-cards';
  ['rent','own'].forEach(t=>{
    const label = document.createElement('label');
    label.innerHTML = `<input type="radio" name="tenure" value="${t}" ${state.housing.tenure===t?'checked':''}> ${t==='rent'?'賃貸':'持ち家'}`;
    label.querySelector('input').addEventListener('change', ()=>{ state.housing.tenure=t; rebuildHousingDetail(); recompute(); });
    radios.appendChild(label);
  });
  tenureRow.appendChild(radios);
  el.appendChild(tenureRow);

  const regionField = document.createElement('div'); regionField.className='field';
  regionField.innerHTML = '<label>居住地域</label>';
  const sel = document.createElement('select');
  for(const key in REGION_INFO){ const opt=document.createElement('option'); opt.value=key; opt.textContent=REGION_INFO[key].label; if(state.housing.region===key) opt.selected=true; sel.appendChild(opt); }
  sel.addEventListener('change', ()=>{ state.housing.region=sel.value; recompute(); });
  regionField.appendChild(sel);
  el.appendChild(regionField);

  const detailDiv = document.createElement('div'); detailDiv.id='housing-detail';
  el.appendChild(detailDiv);

  const lifestyleH = document.createElement('h3'); lifestyleH.textContent='生活の贅沢度'; el.appendChild(lifestyleH);
  el.appendChild(sliderField('日々の生活の贅沢度', state.lifestyle.luxury, 0, 1, 0.05,
    v=> v<0.34?'質素':(v<0.67?'標準':'贅沢'),
    v=>state.lifestyle.luxury=v, {left:'質素', right:'贅沢'}));
  el.appendChild(sliderField('外食・中食の頻度（週あたり回数）', state.lifestyle.diningOutPerWeek, 0, 7, 1,
    v=>v+'回/週', v=>state.lifestyle.diningOutPerWeek=v, {left:'0回', right:'毎日'}));
  el.appendChild(sliderField('職住距離のこだわり', state.lifestyle.commute, 0, 1, 0.05,
    v=>{ const pct = Math.round((1.15-0.3*v-1)*100); return (v<0.34?'駅近・都心寄り':(v<0.67?'標準':'郊外でも可'))+`（家賃${pct>=0?'+':''}${pct}%）`; },
    v=>state.lifestyle.commute=v, {left:'駅近・都心寄り', right:'郊外でも可'}));
  el.insertAdjacentHTML('beforeend', '<p class="hint">※職住距離のこだわりは賃貸の家賃に±15%の係数として反映されます。持ち家の場合は購入価格に自分で織り込んでください。</p>');

  el.insertAdjacentHTML('beforeend', stepNavButtons('profile','family'));
  rebuildHousingDetail(detailDiv);
  return el;
}
function rebuildHousingDetail(container){
  container = container || document.getElementById('housing-detail');
  container.innerHTML='';
  const row = document.createElement('div'); row.className='field-row';
  row.appendChild(numField('広さ（㎡）', state.housing.sizeSqm, v=>state.housing.sizeSqm=v));
  if(state.housing.tenure==='own'){
    row.appendChild(numField('購入価格（万円・目安値）', state.housing.purchasePrice, v=>state.housing.purchasePrice=v, {unit:10000,
      info:'地域・広さ別の公的な相場データは収録していないため、想定する物件価格を直接入力してください。'}));
    row.appendChild(numField('頭金（万円）', state.housing.downPayment, v=>state.housing.downPayment=v, {unit:10000}));
    row.appendChild(numField('ローン年数', state.housing.loanYears, v=>state.housing.loanYears=v));
    row.appendChild(numField('金利（%）', state.housing.loanRate, v=>state.housing.loanRate=v, {step:0.1}));
  }
  container.appendChild(row);
}

function buildFamilyStep(){
  const el = document.createElement('section'); el.className='step'; el.id='step-family';
  el.innerHTML = '<h2>家族構成・教育</h2>';
  const listDiv = document.createElement('div'); listDiv.id='children-list';
  el.appendChild(listDiv);
  const addBtn = document.createElement('button'); addBtn.className='btn secondary'; addBtn.textContent='+ 子供を追加';
  addBtn.addEventListener('click', ()=>{ state.children.push({birthParentAge: state.profile.currentAge+5, track:'public'}); renderChildrenList(); recompute(); });
  el.appendChild(addBtn);
  el.insertAdjacentHTML('beforeend', stepNavButtons('housing','retirement'));
  renderChildrenList(listDiv);
  return el;
}
const STAGE_SELECT_DEFS = [
  { key:'kindergarten', label:'幼稚園', options:[['public','公立'],['private','私立']] },
  { key:'elementary',   label:'小学校', options:[['public','公立'],['private','私立']] },
  { key:'juniorHigh',   label:'中学校', options:[['public','公立'],['private','私立']] },
  { key:'highSchool',   label:'高校',   options:[['public','公立'],['private','私立']] },
  { key:'university',   label:'大学',   options:[['national','国公立'],['privateLiberal','私立文系'],['privateScience','私立理系'],['none','進学しない']] },
];

function renderChildrenList(container){
  container = container || document.getElementById('children-list');
  container.innerHTML='';
  state.children.forEach((child, idx)=>{
    if(!child.stages) child.stages = {...(EDU_TRACK_PRESETS[child.track]||EDU_TRACK_PRESETS.public)};
    const row = document.createElement('div'); row.className='child-row';
    row.innerHTML = `<button class="remove" type="button">✕ 削除</button><h3>第${idx+1}子</h3>`;
    const fr = document.createElement('div'); fr.className='field-row';
    fr.appendChild(numField('誕生時の親の年齢', child.birthParentAge, v=>child.birthParentAge=v));
    const trackField = document.createElement('div'); trackField.className='field';
    trackField.innerHTML='<label>進学コース</label>';
    const sel = document.createElement('select');
    [['public','すべて公立・国公立大'],['mixed','公立中心・私立大学'],['private','すべて私立'],['custom','カスタム(詳細設定で調整)']].forEach(([v,l])=>{
      const opt=document.createElement('option'); opt.value=v; opt.textContent=l; if(child.track===v) opt.selected=true; sel.appendChild(opt);
    });
    sel.addEventListener('change', ()=>{
      child.track = sel.value;
      if(sel.value!=='custom'){
        child.stages = {...EDU_TRACK_PRESETS[sel.value]};
        stageSelects.forEach(({key, select})=>{ select.value = child.stages[key]; });
      }
      recompute();
    });
    trackField.appendChild(sel);
    fr.appendChild(trackField);
    row.appendChild(fr);

    // 詳細設定: 段階ごとに公立/私立(大学は国公立/私立文理/進学しない)を選ぶ
    const adv = advancedSection('詳細設定（段階ごとに選ぶ）');
    const advRow = document.createElement('div'); advRow.className='field-row';
    const stageSelects = [];
    STAGE_SELECT_DEFS.forEach(def=>{
      const f = document.createElement('div'); f.className='field';
      f.innerHTML = `<label>${def.label}</label>`;
      const s = document.createElement('select');
      def.options.forEach(([v,l])=>{
        const opt=document.createElement('option'); opt.value=v; opt.textContent=l; if(child.stages[def.key]===v) opt.selected=true; s.appendChild(opt);
      });
      s.addEventListener('change', ()=>{
        child.stages[def.key] = s.value;
        child.track = 'custom';
        sel.value = 'custom';
        recompute();
      });
      f.appendChild(s);
      advRow.appendChild(f);
      stageSelects.push({key:def.key, select:s});
    });
    adv.panel.appendChild(advRow);
    row.appendChild(adv.btn); row.appendChild(adv.panel);

    row.querySelector('.remove').addEventListener('click', ()=>{ state.children.splice(idx,1); renderChildrenList(); recompute(); });
    container.appendChild(row);
  });
}

function buildRetirementStep(){
  const el = document.createElement('section'); el.className='step'; el.id='step-retirement';
  el.innerHTML = '<h2>老後の生活</h2>';
  const row = document.createElement('div'); row.className='field-row';
  row.appendChild(numField('退職年齢', state.retirement.retireAge, v=>state.retirement.retireAge=v));
  el.appendChild(row);
  el.appendChild(sliderField('老後のゆとり度合い（最低日常生活費〜ゆとりある老後生活費）', state.retirement.level, 0, 1, 0.05,
    v=>fmtYen(RETIREMENT_MIN_MONTHLY+(RETIREMENT_COMFORT_MONTHLY-RETIREMENT_MIN_MONTHLY)*v)+'/月',
    v=>state.retirement.level=v, {left:'最低限(23.9万円/月)', right:'ゆとり(39.1万円/月)'}));
  const pensionField = document.createElement('div'); pensionField.className='field';
  pensionField.innerHTML = '<label>年金受給見込み</label>';
  const sel = document.createElement('select');
  [['model','モデル年金（夫婦2人・厚生年金あり）232,784円/月'],['basic','老齢基礎年金のみ（夫婦2人分満額）135,616円/月']].forEach(([v,l])=>{
    const opt=document.createElement('option'); opt.value=v; opt.textContent=l; if(state.retirement.pensionType===v) opt.selected=true; sel.appendChild(opt);
  });
  sel.addEventListener('change', ()=>{ state.retirement.pensionType=sel.value; recompute(); });
  pensionField.appendChild(sel);
  el.appendChild(pensionField);
  el.insertAdjacentHTML('beforeend', stepNavButtons('family','investment'));
  return el;
}

function buildInvestmentStep(){
  const el = document.createElement('section'); el.className='step'; el.id='step-investment';
  el.innerHTML = '<h2>投資前提</h2>';
  const returnField = document.createElement('div'); returnField.className='field';
  returnField.innerHTML='<label>想定運用利回り</label>';
  const sel = document.createElement('select');
  [['conservative','保守的 3%'],['standard','標準 4%'],['aggressive','積極的 5%'],['gpifHistorical','GPIF実績 4.18%'],['custom','カスタム']].forEach(([v,l])=>{
    const opt=document.createElement('option'); opt.value=v; opt.textContent=l; sel.appendChild(opt);
  });
  const matchedPreset = Object.keys(RETURN_PRESETS).find(k=>RETURN_PRESETS[k]===state.investment.returnRate);
  sel.value = matchedPreset || 'custom';
  sel.addEventListener('change', ()=>{
    if(sel.value!=='custom'){ state.investment.returnRate = RETURN_PRESETS[sel.value]; rebuildInvestmentDetail(); }
    recompute();
  });
  returnField.appendChild(sel);
  el.appendChild(returnField);
  const detail = document.createElement('div'); detail.id='investment-detail';
  el.appendChild(detail);
  el.insertAdjacentHTML('beforeend', stepNavButtons('retirement','results'));
  rebuildInvestmentDetail(detail);
  return el;
}
function rebuildInvestmentDetail(container){
  container = container || document.getElementById('investment-detail');
  container.innerHTML='';
  const row = document.createElement('div'); row.className='field-row';
  row.appendChild(numField('想定運用利回り（%、カスタム調整可）', +(state.investment.returnRate*100).toFixed(2), v=>state.investment.returnRate=v/100, {step:0.1,
    info:'積立投資の年率リターンの想定。参考: GPIF(公的年金の運用)の2001〜2024年度実績は年率4.18%。'}));
  row.appendChild(numField('想定インフレ率（%）', +(state.investment.inflationRate*100).toFixed(2), v=>state.investment.inflationRate=v/100, {step:0.1,
    info:'物価が毎年何%上がるかの想定。日本銀行は2%を「物価安定の目標」としています。教育費や生活費はこの率で将来に向けて増額されます。'}));
  row.appendChild(numField('手取り率（%）', +(state.investment.netIncomeRatio*100).toFixed(1), v=>state.investment.netIncomeRatio=v/100, {step:0.5,
    info:'額面年収に対する手取りの割合。税金・社会保険料を引いた後に自由に使えるお金の比率で、「必要年収」への換算に使います。年収500万円前後ならおおむね75〜80%です。'}));
  container.appendChild(row);
}

    <p class="hint">各タブでいつでも入力を調整できます。値を変えると結果は即座に更新されます。</p>
    <div class="hero-result">

      <tbody id="stage-table-body"></tbody>

function rebuildAllSteps(){
  const main = document.getElementById('main-steps');
  main.innerHTML='';
  main.appendChild(buildStartStep());
  main.appendChild(buildProfileStep());
  main.appendChild(buildHousingStep());
  main.appendChild(buildFamilyStep());
  main.appendChild(buildRetirementStep());
  main.appendChild(buildInvestmentStep());
  main.appendChild(buildResultsStep());
  setActiveStep(state.activeStep);
}

function buildSources(){
  const list = document.getElementById('sources-list');
  list.innerHTML='';
  Object.values(DATA_SOURCES).forEach(src=>{
    const li = document.createElement('li');
    li.innerHTML = `<a href="${src.url}" target="_blank" rel="noopener">${src.label}</a>`;
    list.appendChild(li);
  });
}

/* =====================================================================
   I. 初期化
===================================================================== */
function init(){
  loadPersistedState();
  const fromShareLink = decodeStateFromHash(); // 共有リンク経由ならその内容を優先
  ensureStateDefaults();
  buildNav();
  rebuildAllSteps();
  buildSources();
  setActiveStep(fromShareLink ? 'results' : (state.activeStep || 'start'));
  recompute();
}
init();
</script>
